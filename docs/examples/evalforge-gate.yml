# Example: How EvalForge blocks a bad RAG or prompt change in CI/CD
#
# This workflow demonstrates the production integration pattern. In a real setup:
# 1. Host EvalForge as a service or run Docker Compose in CI.
# 2. Seed eval suites per project.
# 3. Run baseline and candidate evaluations.
# 4. Create a comparison.
# 5. Use the CI gate CLI to write JSON/Markdown artifacts and fail on regressions.
#
# This file is an example. It assumes EvalForge is running at
# http://evalforge.internal:8000 and has been pre-seeded with the project eval suite.

name: EvalForge Regression Gate (Example)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "prompts/**"
      - "config/**"

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Trigger baseline eval
        id: baseline
        run: |
          RESPONSE=$(curl -s -X POST http://evalforge.internal:8000/api/runs \
            -H "Content-Type: application/json" \
            -d '{
              "app_version_id": "${{ vars.EVALFORGE_BASELINE_VERSION_ID }}",
              "suite_id": "${{ vars.EVALFORGE_SUITE_ID }}",
              "evaluator_config_id": "${{ vars.EVALFORGE_EVALUATOR_CONFIG_ID }}"
            }')
          echo "run_id=$(echo "$RESPONSE" | jq -r .id)" >> "$GITHUB_OUTPUT"

      - name: Trigger candidate eval
        id: candidate
        run: |
          RESPONSE=$(curl -s -X POST http://evalforge.internal:8000/api/runs \
            -H "Content-Type: application/json" \
            -d '{
              "app_version_id": "${{ vars.EVALFORGE_CANDIDATE_VERSION_ID }}",
              "suite_id": "${{ vars.EVALFORGE_SUITE_ID }}",
              "evaluator_config_id": "${{ vars.EVALFORGE_EVALUATOR_CONFIG_ID }}"
            }')
          echo "run_id=$(echo "$RESPONSE" | jq -r .id)" >> "$GITHUB_OUTPUT"

      - name: Wait for completion
        run: |
          for i in $(seq 1 60); do
            BASELINE_STATUS=$(curl -s http://evalforge.internal:8000/api/runs/${{ steps.baseline.outputs.run_id }} | jq -r .status)
            CANDIDATE_STATUS=$(curl -s http://evalforge.internal:8000/api/runs/${{ steps.candidate.outputs.run_id }} | jq -r .status)
            if [ "$BASELINE_STATUS" = "completed" ] && [ "$CANDIDATE_STATUS" = "completed" ]; then
              echo "Both runs completed"
              break
            fi
            echo "Waiting for EvalForge runs... ($i/60)"
            sleep 10
          done

      - name: Create comparison
        id: comparison
        run: |
          RESPONSE=$(curl -s -X POST http://evalforge.internal:8000/api/comparisons \
            -H "Content-Type: application/json" \
            -d '{
              "baseline_run_id": "${{ steps.baseline.outputs.run_id }}",
              "candidate_run_id": "${{ steps.candidate.outputs.run_id }}",
              "gate_rules_id": "${{ vars.EVALFORGE_GATE_RULES_ID }}"
            }')
          echo "comparison_id=$(echo "$RESPONSE" | jq -r .id)" >> "$GITHUB_OUTPUT"

      - name: Check EvalForge deployment gate
        id: gate
        run: |
          python -m pip install uv
          uv run --directory backend python -m app.cli.gate \
            --base-url http://evalforge.internal:8000 \
            --comparison-id "${{ steps.comparison.outputs.comparison_id }}" \
            --dashboard-url http://evalforge.internal:5173 \
            --json-out gate-report.json \
            --markdown-out gate-report.md
          echo "verdict=$(jq -r .verdict gate-report.json)" >> "$GITHUB_OUTPUT"

      - name: Publish EvalForge report
        if: always()
        run: |
          cat gate-report.md >> "$GITHUB_STEP_SUMMARY"
          # In a real setup: use `gh pr comment --body-file gate-report.md`.
