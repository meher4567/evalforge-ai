services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: evalforge-postgres
    environment:
      POSTGRES_DB: evalforge
      POSTGRES_USER: evalforge
      POSTGRES_PASSWORD: evalforge
    ports:
      - "${EVALFORGE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - evalforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalforge -d evalforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: evalforge-redis
    ports:
      - "${EVALFORGE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      EVALFORGE_ENVIRONMENT: docker
      EVALFORGE_DATABASE_URL: postgresql+asyncpg://evalforge:evalforge@postgres:5432/evalforge
      EVALFORGE_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: evalforge-backend
    environment:
      EVALFORGE_ENVIRONMENT: docker
      EVALFORGE_DATABASE_URL: postgresql+asyncpg://evalforge:evalforge@postgres:5432/evalforge
      EVALFORGE_REDIS_URL: redis://redis:6379/0
      EVALFORGE_HEALTH_CHECK_TIMEOUT_SECONDS: "2.0"
      EVALFORGE_RUN_MODE: celery
      EVALFORGE_API_KEY: ${EVALFORGE_API_KEY:-}
      EVALFORGE_AUTH_TOKEN_PEPPER: ${EVALFORGE_AUTH_TOKEN_PEPPER:-development-only-pepper}
      EVALFORGE_BOOTSTRAP_TOKEN: ${EVALFORGE_BOOTSTRAP_TOKEN:-}
      EVALFORGE_METRICS_TOKEN: ${EVALFORGE_METRICS_TOKEN:-}
      EVALFORGE_CORS_ORIGINS: ${EVALFORGE_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      EVALFORGE_ALLOWED_HOSTS: ${EVALFORGE_ALLOWED_HOSTS:-127.0.0.1,localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "${EVALFORGE_BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ./backend
    container_name: evalforge-worker
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --loglevel=info
      - --concurrency=4
    environment:
      EVALFORGE_ENVIRONMENT: docker
      EVALFORGE_DATABASE_URL: postgresql+asyncpg://evalforge:evalforge@postgres:5432/evalforge
      EVALFORGE_REDIS_URL: redis://redis:6379/0
      EVALFORGE_HEALTH_CHECK_TIMEOUT_SECONDS: "2.0"
      EVALFORGE_RUN_MODE: celery
      EVALFORGE_API_KEY: ${EVALFORGE_API_KEY:-}
      EVALFORGE_AUTH_TOKEN_PEPPER: ${EVALFORGE_AUTH_TOKEN_PEPPER:-development-only-pepper}
      EVALFORGE_BOOTSTRAP_TOKEN: ${EVALFORGE_BOOTSTRAP_TOKEN:-}
      EVALFORGE_METRICS_TOKEN: ${EVALFORGE_METRICS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: evalforge-frontend
    ports:
      - "${EVALFORGE_FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  evalforge-postgres-data:
