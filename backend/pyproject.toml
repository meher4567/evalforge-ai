[project]
name = "evalforge-backend"
version = "0.1.0"
description = "Backend API for EvalForge AI"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0,<0.23.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "celery>=5.4.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "numpy>=1.26.0",
    "opentelemetry-api>=1.28.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0.0",
    "opentelemetry-sdk>=1.28.0,<2.0.0",
    "pgvector>=0.3.6",
    "prometheus-client>=0.21.0,<1.0.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.0",
    "redis>=5.0.8",
    "scipy>=1.11.0",
    "sentry-sdk[fastapi]>=2.18.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "tiktoken>=0.7.0",
    "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.8",
]
ml = [
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
]
load = [
    "locust>=2.32.0,<3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
