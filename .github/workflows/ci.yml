name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --directory backend

      - name: Run backend tests with coverage gate
        run: uv run --directory backend pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Run backend lint
        run: uv run --directory backend ruff check .

      - name: Check backend formatting
        run: uv run --directory backend ruff format --check .

      - name: Audit Python dependencies
        run: uvx pip-audit --path backend/.venv/lib/python3.11/site-packages

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend type check
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E smoke
        working-directory: frontend
        run: npm run test:e2e -- --project=chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Audit all frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
