name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.17"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --directory backend

      - name: Run backend tests with coverage gate
        run: uv run --directory backend pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Run backend lint
        run: uv run --directory backend ruff check .

      - name: Check backend formatting
        run: uv run --directory backend ruff format --check .

      - name: Audit Python dependencies
        run: uvx pip-audit --path backend/.venv/lib/python3.11/site-packages

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend type check
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E smoke
        working-directory: frontend
        run: npm run test:e2e -- --project=chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Audit all frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
