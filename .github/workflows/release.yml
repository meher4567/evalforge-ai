name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify backend
        working-directory: backend
        run: |
          uv sync --locked --group dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest tests --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test -- --run
          npm run build

      - name: Create source archives
        run: |
          git archive --format=tar.gz --prefix="evalforge-ai-${GITHUB_REF_NAME}/" \
            --output="evalforge-ai-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="evalforge-ai-${GITHUB_REF_NAME}/" \
            --output="evalforge-ai-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"
          sha256sum evalforge-ai-* > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "EvalForge AI ${GITHUB_REF_NAME}" \
            evalforge-ai-*.tar.gz evalforge-ai-*.zip SHA256SUMS
